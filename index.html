<!DOCTYPE html>
<!--
  ============================================================
  수정할 위치 안내 (Jeongjae Song Portfolio)
  ------------------------------------------------------------
  1) 이름·한글이름·소개문구·이메일·전화번호 → 맨 아래 <script> 최상단 CONFIG
     (전화번호를 "" 로 비우면 Call 버튼이 숨겨집니다)
  2) Height / Size / Shoe 수치 → "PROFILE 수치" 주석이 있는 <dl> 부분
  3) 검색 노출 차단(noindex) → <head> 안 "NOINDEX" 주석의 <meta name="robots"> 한 줄
     (검색에 노출하려면 그 줄을 삭제하세요)
  4) Open Graph 설명 → <head> 안 og:description
  5) 이미지 → images/ 폴더: hero.jpg, profile.jpg, look1.jpg ~ look6.jpg
  ============================================================
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeongjae Song — Senior Model</title>
  <meta name="description" content="Jeongjae Song — Senior Model portfolio">

  <!-- NOINDEX: 검색 노출 방지. 공개할 준비가 되면 아래 한 줄을 삭제하세요 -->
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Jeongjae Song — Senior Model">
  <meta property="og:description" content="Jeongjae Song — Senior Model">
  <meta property="og:image" content="images/hero.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script>
    /* 이미지 로드 실패 → 회색 placeholder (파일명 표시). onerror가 바로 쓰도록 head에 둠 */
    function imgFail(img) {
      var box = img.closest("[data-file]");
      if (box) box.classList.add("ph");
    }
  </script>

  <style>
    :root {
      --bg: #FFFFFF;
      --text: #333333;
      --accent: #E07A5F;
      --serif: "Playfair Display", "Noto Serif KR", serif;
      --sans: "Noto Sans KR", "Pretendard", system-ui, sans-serif;
      --gap: 40px;
      --ease: cubic-bezier(.22, .8, .3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; width: 100%; height: 100%; object-fit: cover; }
    h1, h2 { font-family: var(--serif); font-weight: 500; }

    /* ---------- reveal (fade-in) ---------- */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
    .reveal.in { opacity: 1; transform: none; }

    /* ---------- image placeholder ---------- */
    .ph { background: #EEE; position: relative; }
    .ph img { visibility: hidden; }
    .ph::after {
      content: attr(data-file);
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; letter-spacing: .1em; color: #999;
    }

    /* ---------- hover zoom ---------- */
    .zoom { overflow: hidden; }
    .zoom img { transition: transform .6s var(--ease); }
    .zoom:hover img { transform: scale(1.03); }

    /* ---------- hero ---------- */
    .hero { position: relative; height: 100vh; height: 100svh; min-height: 520px; color: #fff; overflow: hidden; background: #EEE; }
    .hero.ph { color: #333; }
    .hero.ph::before { display: none; }
    .hero.ph h1 { text-shadow: none; }
    .hero.ph::after { top: auto; bottom: 24px; }
    .hero > img { position: absolute; inset: 0; object-position: 46% 41%; }
    .hero::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,.12) 0%, rgba(0,0,0,.18) 40%, rgba(0,0,0,.45) 100%);
    }
    .hero-text {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      text-align: center; padding: 0 5vw 5vh; /* 얼굴을 가리지 않도록 제목을 아래쪽에 배치 */
    }
    .hero h1 {
      font-size: clamp(3rem, 9vw, 7.5rem);
      line-height: 1; letter-spacing: .01em; font-weight: 400;
      text-shadow: 0 2px 30px rgba(0,0,0,.25);
    }
    .hero .role { margin-top: 1.6rem; font-size: clamp(.75rem, 1.4vw, .95rem); letter-spacing: .45em; text-transform: uppercase; font-weight: 400; padding-left: .45em; }
    .hero .tagline { margin-top: .9rem; font-family: var(--serif); font-style: italic; font-size: clamp(.95rem, 1.8vw, 1.25rem); opacity: .92; }

    /* ---------- sections ---------- */
    section { padding: clamp(80px, 12vw, 160px) 6vw; }
    .wrap { width: 100%; max-width: 1200px; margin: 0 auto; }
    .section-title { font-size: clamp(2rem, 4.5vw, 3.4rem); text-align: center; }
    .section-title::after { content: ""; display: block; width: 56px; height: 1px; background: var(--accent); margin: 1.2rem auto 0; }

    /* ---------- profile ---------- */
    .profile-grid { display: grid; grid-template-columns: 5fr 6fr; gap: clamp(40px, 8vw, 120px); align-items: center; }
    .profile-photo { aspect-ratio: 3 / 4; }
    .profile-photo img { filter: grayscale(100%); object-position: 50% 0%; }
    .stats { list-style: none; }
    .stats .row { padding: 2.2rem 0; border-bottom: 1px solid var(--accent); }
    .stats .row:first-child { border-top: 1px solid var(--accent); }
    .stats dt { font-size: .75rem; letter-spacing: .35em; text-transform: uppercase; font-weight: 400; color: #777; }
    .stats dd { font-variant-numeric: lining-nums tabular-nums; font-family: var(--serif); font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1.15; margin-top: .4rem; }

    /* ---------- lookbook ---------- */
    .lookbook .wrap { max-width: 1280px; }
    .look-grid { display: grid; grid-template-columns: 1fr; gap: var(--gap); margin-top: clamp(48px, 7vw, 88px); }
    .lookbook2 .look-grid { margin-top: 0; }
    .look { cursor: zoom-in; background: #EEE; }
    .look.ph { cursor: default; }
    /* 사진이 모두 세로형이라 원본 비율(2:3, 3:4)에 가까운 칸으로 구성. 얼굴 기준 object-position은 사진별로 지정 */
    .look-1 { aspect-ratio: 2 / 3; }
    .look-1 img { object-position: 52% 30%; }
    .look-6 { aspect-ratio: 2 / 3; }
    .look-6 img { object-position: 52% 22%; }
    .look-2 { aspect-ratio: 2 / 3; }
    .look-2 img { object-position: 55% 20%; }
    .look-3 { aspect-ratio: 3 / 4; }
    .look-3 img { object-position: 54% 15%; }
    .look-4 { aspect-ratio: 3 / 4; }
    .look-4 img { object-position: 50% 30%; }
    .look-5 { aspect-ratio: 2 / 3; }
    .look-5 img { object-position: 54% 15%; }

    /* ---------- lightbox ---------- */
    .lightbox {
      position: fixed; inset: 0; z-index: 100; background: rgba(255,255,255,.96);
      display: flex; align-items: center; justify-content: center; padding: 4vw;
      opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; cursor: zoom-out;
    }
    .lightbox.open { opacity: 1; visibility: visible; }
    .lightbox img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.15); }
    .lightbox button {
      position: absolute; top: 20px; right: 24px; background: none; border: 0; cursor: pointer;
      font-size: 2rem; line-height: 1; color: var(--text); transition: color .3s;
    }
    .lightbox button:hover { color: var(--accent); }
    .lightbox img { transition: opacity .25s; cursor: default; touch-action: pan-y; }
    .lightbox img.swap { opacity: 0; }
    .lightbox .lb-nav { top: 50%; transform: translateY(-50%); font-size: 2.6rem; padding: 12px 18px; }
    .lightbox .lb-prev { left: 12px; right: auto; }
    .lightbox .lb-next { right: 12px; }
    @media (max-width: 768px) { .lightbox .lb-nav { font-size: 2rem; padding: 10px; } }

    /* ---------- contact ---------- */
    .contact { text-align: center; }
    .contact p.lead { margin-top: 2rem; font-family: var(--serif); font-style: italic; font-size: clamp(1.1rem, 2.2vw, 1.5rem); }
    .btns { margin-top: 2.6rem; display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: .9rem 2.6rem; border: 1px solid var(--accent); color: var(--accent);
      text-decoration: none; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; font-weight: 400;
      transition: background .3s, color .3s, transform .3s var(--ease);
    }
    .btn:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }
    .btn[hidden] { display: none; }
    .email-text { font-size: .85rem; color: #777; margin-left: 12px; }
    footer { text-align: center; font-size: .75rem; letter-spacing: .15em; color: #999; margin-top: 64px; }

    /* ---------- dot navigation (데스크톱만) ---------- */
    .dots { display: none; }

    /* ---------- desktop: 한 번에 한 페이지씩 스냅 스크롤 (5페이지) ---------- */
    @media (min-width: 769px) {
      html { scroll-snap-type: y mandatory; scrollbar-gutter: stable; }
      html.lb-open { overflow: hidden; } /* 라이트박스가 열려 있으면 스크롤 잠금 */
      .page { min-height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; }
      section.page { display: flex; flex-direction: column; justify-content: center; padding: 48px 6vw; }
      .hero.page { height: 100svh; }

      /* Profile: 한 화면에 들어오도록 높이 기준으로 사진 크기 결정 */
      .profile-photo { height: min(calc(100svh - 120px), 640px); max-width: 100%; }
      .stats .row { padding: clamp(1rem, 3.4svh, 2.2rem) 0; }
      .stats dd { font-size: clamp(2rem, 6.5svh, 4rem); }

      /* Lookbook: 페이지마다 사진 3장이 100svh 안에 들어오게 높이(--H) 기준으로 배치 */
      .lookbook-page { --H: clamp(300px, min(calc(100svh - 300px), 36vw), 640px); }
      /* 2페이지(제목 없음): 가장 큰 사진이 화면 높이의 약 72%. 가로 폭이 모자라지 않게 폭 기준 상한도 둠 */
      .lookbook2.lookbook-page { --H: clamp(300px, min(72svh, calc((88vw - 80px) / 1.825), 860px), 860px); }
      .look-grid { display: flex; justify-content: center; align-items: flex-start; height: var(--H); margin-top: clamp(24px, 4svh, 48px); }
      .lookbook2 .look-grid { margin-top: 0; }
      .look { flex: none; width: auto; }
      .look-1 { height: var(--H); align-self: flex-start; }
      .look-2 { height: calc(var(--H) * .8); align-self: flex-end; }
      .look-3 { height: calc(var(--H) * .9); align-self: center; }
      .look-4 { height: calc(var(--H) * .85); align-self: flex-end; }
      .look-5 { height: var(--H); align-self: center; }
      .look-6 { height: calc(var(--H) * .78); align-self: flex-start; }

      .contact footer { position: absolute; left: 0; right: 0; bottom: 28px; margin: 0; }

      .dots { display: flex; flex-direction: column; gap: 14px; position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 50; }
      .dots button {
        width: 10px; height: 10px; padding: 0; border-radius: 50%; cursor: pointer;
        background: transparent; border: 1px solid #333; box-shadow: 0 0 0 1px rgba(255,255,255,.7);
        transition: background .3s, border-color .3s, transform .3s var(--ease);
      }
      .dots button { position: relative; }
      .dots button::before { /* 마우스를 올리면 점 왼쪽에 섹션 이름 표시 */
        content: attr(data-label); position: absolute; right: calc(100% + 14px); top: 50%;
        transform: translate(6px, -50%); white-space: nowrap; pointer-events: none;
        padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.94); color: var(--text);
        font: 400 .7rem/1.5 var(--sans); letter-spacing: .12em; box-shadow: 0 1px 8px rgba(0,0,0,.12);
        opacity: 0; transition: opacity .25s, transform .3s var(--ease);
      }
      .dots button:hover::before, .dots button:focus-visible::before { opacity: 1; transform: translate(0, -50%); }
      .dots button:hover { border-color: var(--accent); transform: scale(1.25); }
      .dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
    }

    /* ---------- responsive (모바일: 스냅 없이 자연 스크롤) ---------- */
    @media (max-width: 768px) {
      :root { --gap: 24px; }
      section { padding: 72px 6vw; }
      .lookbook:not(.lookbook2) { padding-bottom: var(--gap); } /* look3~look4 사이도 다른 사진과 같은 간격 */
      .lookbook2 { padding-top: 0; }
      .hero > img { object-position: 44% center; }
      .profile-grid { grid-template-columns: 1fr; gap: 40px; }
      .stats .row { padding: 1.6rem 0; }
      .email-text { display: none; }
      .btns { flex-direction: column; }
      .btn { width: 100%; max-width: 280px; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { transition: none; opacity: 1; transform: none; }
      .zoom img, .btn, .dots button { transition: none; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <header class="hero page" id="hero" data-file="hero.jpg">
    <img src="images/hero.jpg" alt="Close-up portrait of Jeongjae Song smiling in a white shirt against a light grey backdrop" onerror="imgFail(this)">
    <div class="hero-text">
      <h1 id="heroName" class="reveal">Jeongjae Song</h1>
      <div class="role reveal">Senior Model</div>
      <div class="tagline reveal" id="tagline"></div>
    </div>
  </header>

  <!-- PROFILE -->
  <section class="profile page" id="profile">
    <div class="wrap profile-grid">
      <div class="profile-photo zoom reveal" data-file="profile.jpg">
        <img src="images/profile.jpg" alt="Black-and-white portrait of Jeongjae Song smiling in a white shirt and jeans with a hand in the pocket" loading="lazy" onerror="imgFail(this)">
      </div>
      <!-- PROFILE 수치: Height / Size / Shoe 세 가지만 표시 -->
      <dl class="stats reveal">
        <div class="row"><dt>Height</dt><dd>160cm</dd></div>
        <div class="row"><dt>Size</dt><dd>M (55)</dd></div>
        <div class="row"><dt>Shoe</dt><dd>235mm</dd></div>
      </dl>
    </div>
  </section>

  <!-- LOOKBOOK -->
  <section class="lookbook lookbook-page page" id="lookbook">
    <div class="wrap">
      <h2 class="section-title reveal">Lookbook</h2>
      <div class="look-grid">
        <figure class="look look-1 zoom reveal" data-file="look1.jpg"><img src="images/look1.jpg" alt="Jeongjae Song smiling in a red hanbok in a garden" loading="lazy" onerror="imgFail(this)"></figure>
        <figure class="look look-2 zoom reveal" data-file="look2.jpg"><img src="images/look2.jpg" alt="Jeongjae Song in a white shirt, blue jeans and black heels posing in profile in a studio" loading="lazy" onerror="imgFail(this)"></figure>
        <figure class="look look-3 zoom reveal" data-file="look3.jpg"><img src="images/look3.jpg" alt="Jeongjae Song in a navy cropped blazer and white trousers with hands in pockets" loading="lazy" onerror="imgFail(this)"></figure>
      </div>
    </div>
  </section>

  <!-- LOOKBOOK 2 (제목 없이 사진만) -->
  <section class="lookbook lookbook-page lookbook2 page" id="lookbook2">
    <div class="wrap">
      <div class="look-grid">
        <figure class="look look-4 zoom reveal" data-file="look4.jpg"><img src="images/look4.jpg" alt="Jeongjae Song smiling with a hand on the hip in a black top and pleated skirt" loading="lazy" onerror="imgFail(this)"></figure>
        <figure class="look look-5 zoom reveal" data-file="look5.jpg"><img src="images/look5.jpg" alt="Jeongjae Song in a white shirt and blue jeans standing in a studio" loading="lazy" onerror="imgFail(this)"></figure>
        <figure class="look look-6 zoom reveal" data-file="look6.jpg"><img src="images/look6.jpg" alt="Jeongjae Song in an olive knit sweater and light jeans with arms crossed" loading="lazy" onerror="imgFail(this)"></figure>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="contact page" id="contact" style="position:relative">
    <div class="wrap">
      <h2 class="section-title reveal">Contact</h2>
      <p class="lead reveal">Let's work together</p>
      <div class="btns reveal">
        <a class="btn" id="btnEmail" href="#">Email</a>
        <a class="btn" id="btnCall" href="#" hidden>Call</a>
        <span class="email-text" id="emailText"></span>
      </div>
    </div>
    <footer id="footer"></footer>
  </section>

  <!-- 페이지 점 내비게이션 (데스크톱만 표시) -->
  <nav class="dots" id="dots" aria-label="페이지 이동"></nav>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
    <button type="button" id="lbClose" aria-label="닫기">&times;</button>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="이전 사진">&#8249;</button>
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="다음 사진">&#8250;</button>
    <img id="lbImg" src="" alt="">
  </div>

<script>
/* ===== 수정은 이 CONFIG 한 곳에서만 ===== */
const CONFIG = {
  name: "Jeongjae Song",
  nameKo: "송정재",   // 한글 이름이 다르면 수정
  tagline: "Bright, warm and full of life",
  email: "sjj0119@naver.com",
  phone: ""   //비우면 Call 버튼 숨김
};

(function () {
  const $ = (id) => document.getElementById(id);

  /* 이름·소개 */
  $("heroName").textContent = CONFIG.name;
  $("tagline").textContent = CONFIG.tagline;
  $("footer").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + " (" + CONFIG.nameKo + ")";

  /* 연락처: 문자열을 나눠 조립하여 HTML에 평문이 남지 않게 함 */
  const user = CONFIG.email.split("@")[0];
  const host = CONFIG.email.split("@")[1];
  if (user && host) {
    const addr = [user, host].join(String.fromCharCode(64));
    $("btnEmail").href = "mail" + "to:" + addr;
    $("emailText").textContent = addr;
  } else {
    $("btnEmail").hidden = true;
  }
  const digits = CONFIG.phone.replace(/[^0-9+]/g, "");
  if (digits) {
    $("btnCall").href = "t" + "el:" + digits;
    $("btnCall").hidden = false;
  }

  /* 섹션 페이드인 */
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  /* 라이트박스 */
  const lb = $("lightbox"), lbImg = $("lbImg");
  const root = document.documentElement;
  const looks = [...document.querySelectorAll(".look")].sort((a, b) => a.dataset.file.localeCompare(b.dataset.file)); /* look1~look6 순서 */
  let lbIdx = 0, lastFocus = null;
  const loaded = () => looks.filter((f) => !f.classList.contains("ph"));
  const show = (i, fade) => {
    const list = loaded();
    if (!list.length) return;
    lbIdx = (i + list.length) % list.length; /* 처음↔끝 순환 */
    const img = list[lbIdx].querySelector("img");
    const apply = () => { lbImg.src = img.currentSrc || img.src; lbImg.alt = img.alt; lbImg.classList.remove("swap"); };
    if (fade) { lbImg.classList.add("swap"); setTimeout(apply, 180); } else apply();
  };
  const open = (fig) => {
    lastFocus = document.activeElement;
    show(loaded().indexOf(fig), false);
    lb.classList.add("open");
    root.classList.add("lb-open"); /* 뒤 페이지 스크롤 잠금 */
    $("lbClose").focus({ preventScroll: true });
  };
  const close = () => {
    if (!lb.classList.contains("open")) return;
    lb.classList.remove("open"); root.classList.remove("lb-open");
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  };
  looks.forEach((fig) => fig.addEventListener("click", () => { if (!fig.classList.contains("ph")) open(fig); }));
  $("lbPrev").addEventListener("click", (e) => { e.stopPropagation(); show(lbIdx - 1, true); });
  $("lbNext").addEventListener("click", (e) => { e.stopPropagation(); show(lbIdx + 1, true); });
  $("lbClose").addEventListener("click", (e) => { e.stopPropagation(); close(); });
  /* 바깥(배경) 클릭으로 닫기: 사진·버튼 클릭은 제외 */
  lb.addEventListener("click", (e) => { if (e.target === lb) close(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(lbIdx - 1, true); }
    else if (e.key === "ArrowRight") { e.preventDefault(); show(lbIdx + 1, true); }
  });
  /* 모바일: 좌우 스와이프로 이동 */
  let tx = 0, ty = 0;
  lb.addEventListener("touchstart", (e) => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(lbIdx + (dx < 0 ? 1 : -1), true);
  }, { passive: true });

  /* 점 내비게이션: 5개 페이지, 현재 페이지 표시 + 클릭 이동 */
  const pages = [...document.querySelectorAll(".page")];
  const labels = ["Home", "Profile", "Lookbook", "Lookbook 2", "Contact"];
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  const dots = pages.map((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", labels[i] || "Page " + (i + 1));
    b.dataset.label = labels[i] || "Page " + (i + 1);
    b.addEventListener("click", () => p.scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" }));
    $("dots").appendChild(b);
    return b;
  });
  let cur = 0;
  const setActive = (i) => { cur = i; dots.forEach((d, k) => d.setAttribute("aria-current", k === i ? "true" : "false")); };
  const pageIO = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) setActive(pages.indexOf(e.target)); });
  }, { threshold: 0.55 });
  pages.forEach((p) => pageIO.observe(p));
  setActive(0);

  /* 데스크톱: 휠·키보드 한 번에 정확히 한 페이지씩 이동 (모바일은 자연 스크롤) */
  const desktop = window.matchMedia("(min-width: 769px)");
  let locked = false, navT = 0, lastW = 0;
  const go = (i) => {
    i = Math.max(0, Math.min(pages.length - 1, i));
    if (i === cur) return;
    locked = true; navT = Date.now();
    pages[i].scrollIntoView({ behavior: reduce.matches ? "auto" : "smooth", block: "start" });
  };
  window.addEventListener("wheel", (e) => {
    if (!desktop.matches || lb.classList.contains("open") || e.ctrlKey) return;
    e.preventDefault();
    const now = Date.now();
    if (locked) {
      /* 이동이 끝나고 휠(관성 포함)이 잠잠해질 때까지 새 입력 무시 */
      if (now - navT > 700 && now - lastW > 200) locked = false;
      lastW = now;
      if (locked) return;
    }
    lastW = now;
    if (Math.abs(e.deltaY) < 4) return;
    go(cur + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });
  document.addEventListener("keydown", (e) => {
    if (!desktop.matches || lb.classList.contains("open")) return;
    const next = ["ArrowDown", "PageDown", " "], prev = ["ArrowUp", "PageUp"];
    if (next.includes(e.key)) { e.preventDefault(); if (!locked || Date.now() - navT > 700) go(cur + 1); }
    else if (prev.includes(e.key)) { e.preventDefault(); if (!locked || Date.now() - navT > 700) go(cur - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(pages.length - 1); }
  });
})();
</script>
</body>
</html>
